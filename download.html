<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>ダウンロード - ATOS放送シュミレーター</title>

        <style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #0f0f14;
    color: #eaeaea;
}

header {
    padding: 40px;
    text-align: center;
    background: #1a1d25;
}

section {
    max-width: 800px;
    margin: auto;
    padding: 30px;
}

.card {
    background: #1b1f2a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.versionBox {
    background: #141824;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.versionTitle {
    font-weight: bold;
}

.button {
    display: inline-block;
    padding: 10px 14px;
    background: #4aa3ff;
    color: #000;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

/* 旧バージョン折りたたみ */
details {
    background: #121522;
    padding: 10px;
    border-radius: 10px;
}

summary {
    cursor: pointer;
    font-weight: bold;
    padding: 8px;
}

.notice {
    background: #2a1f1f;
    border-left: 4px solid #ff5555;
    padding: 12px;
    border-radius: 8px;
}
</style>

    <body>
