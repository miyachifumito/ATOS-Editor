<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リリースノート - ATOS放送シュミレーター</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
    background: #0f0f14;
    color: #eaeaea;
}

header {
    padding: 30px;
    text-align: center;
    background: #1a1d25;
}

h1 {
    margin: 0;
}

section {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.version {
    background: #1b1f2a;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
}

.tag {
    display: inline-block;
    padding: 3px 8px;
    background: #4aa3ff;
    border-radius: 12px;
    font-size: 12px;
    margin-right: 5px;
}
</style>

</head>

<body>

<header>
    <h1>リリースノート</h1>
    <p>ATOS放送シュミレーター 更新履歴</p>
</header>

<section>

<div class="version">
    <h2>Release 1.0.0</h2>
    <span class="tag">正式版</span>
    <p>
        ・接近放送自動生成機能を追加<br>
        ・パーツベース構造を全面実装<br>
        ・号数自動分解（100/10/1号対応）<br>
        ・行先の単体/接近自動判定<br>
        ・危ないですから表現の分岐対応<br>
        ・フォルダ構造ベース管理に移行<br>
        ・TNQプロジェクト保存機能追加<br>
        ・Undo機能実装
    </p>
</div>

<div class="version">
    <h2>Beta 1.0.0</h2>
    <span class="tag">テスト版</span>
    <p>
        ・音声パーツ管理システム実装<br>
        ・ドラッグ＆ドロップ対応<br>
        ・キュー再生機能<br>
        ・WAV出力機能（初期版）<br>
        ・カテゴリ管理UI
    </p>
</div>

</section>

</body>
</html>
