<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ATOS放送シュミレーター Download Page</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div id="bgGrid"></div>
        <div id="bgGlow"></div>

        <!-- =========================
         ヘッダー
    ========================== -->
        <header id="topHeader">
            <div id="headerInner">
                <div id="mainTitle">DOWNLOAD CENTER</div>
                <div id="subTitle1">ATOS放送シュミレーター 配布ページ</div>
                <div id="subTitle2">最新版・旧版・試験版をこちらから取得できます</div>
                <div id="versionTag">Official Distribution</div>
            </div>
        </header>

        <!-- =========================
         ダウンロード一覧
    ========================== -->
        <section class="infoSection">
            <div class="sectionTitle">AVAILABLE DOWNLOADS</div>
            <div class="sectionBody">

                <div id="downloadWrap">

                    <div class="downloadCard">
                        <div class="downloadTitle">Release 2.0.0用</div>
                        <div class="downloadSub">パーツ集</div>
                        <div class="downloadInfo">公開日：2026年6月13日</div>
                        <div class="downloadInfo">内容：向山佳衣子氏パーツ</div>
                        <a
                            href="https://github.com/miyachifumito/ATOS-Editor/releases/download/Release-2.0.0/SakiyamaParts.zip"
                            class="downloadBtn">
                            ダウンロード
                        </a>
                    </div>

                </div>

            </div>
        </section>

        <!-- =========================
         注意事項
    ========================== -->
        <section class="infoSection">
            <div class="sectionTitle">NOTICE</div>
            <div class="sectionBody">
                <ul class="patchList">
                    <li>パーツファイルは実録のみから選んでおります。</li>
                </ul>
            </div>
        </section>

        <!-- =========================
         戻る
    ========================== -->
        <section class="infoSection">
            <div class="sectionBody" style="text-align:center;">
                <a href="index.html" class="downloadBtn">TOP PAGEへ戻る</a>
            </div>
        </section>

        <footer id="footer">
            ATOS放送シュミレーター Official Distribution Page
        </footer>

        <script src="script.js"></script>
    </body>
</html>
